<style>
	.floating-menu {
		position: fixed;
		top: 30px;
		right: 30px;
		z-index: 99999;
		font-family: 'Be Vietnam Pro', sans-serif;
	}

	.fm-wrapper {
		position: relative;
		display: flex;
		align-items: center;
		justify-content: flex-end;
	}

	.fm-trigger {
		width: 52px;
		height: 52px;
		min-width: 52px;
		background: linear-gradient(135deg, #0B1D26, #4682A9, #2E3A59, #145374);
		border-radius: 50%;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		cursor: pointer;
		box-shadow: 0 4px 20px rgba(11, 29, 38, 0.4);
		transition: all 0.3s ease;
		z-index: 2;
		position: relative;
	}

	.fm-wrapper:hover .fm-trigger {
		transform: scale(1.08);
		box-shadow: 0 6px 30px rgba(11, 29, 38, 0.6);
	}

	.fm-trigger span {
		display: block;
		width: 20px;
		height: 2px;
		background: #FFFFFF;
		margin: 2.5px 0;
		transition: all 0.3s ease;
		border-radius: 2px;
	}

	.fm-items {
		position: absolute;
		top: 0;
		right: 0;
		width: 0;
		height: 52px;
		overflow: hidden;
		background: linear-gradient(135deg, #0B1D26, #4682A9, #2E3A59, #145374);
		border-radius: 26px;
		transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), height 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
		box-shadow: 0 4px 20px rgba(11, 29, 38, 0.4);
		z-index: 1;
		display: flex;
		align-items: center;
	}

	.fm-wrapper:hover .fm-items {
		width: 210px;
		height: 180px;
	}

	.fm-items-inner {
		display: flex;
		flex-direction: column;
		justify-content: center;
		padding: 0 20px;
		width: 100%;
		opacity: 0;
		transition: opacity 0.2s ease;
	}

	.fm-wrapper:hover .fm-items-inner {
		opacity: 1;
		transition-delay: 0.15s;
	}

	.fm-items a {
		color: #FFFFFF;
		text-decoration: none;
		font-size: 14px;
		font-weight: 500;
		padding: 8px 0;
		white-space: nowrap;
		transition: all 0.2s ease;
		letter-spacing: 0.3px;
		position: relative;
	}

	.fm-items a::after {
		content: '';
		position: absolute;
		bottom: 6px;
		left: 0;
		width: 0;
		height: 1px;
		background: #FFFFFF;
		transition: width 0.3s ease;
	}

	.fm-items a:hover::after {
		width: 100%;
	}
</style>

<div class="floating-menu">
	<div class="fm-wrapper">
		<div class="fm-items">
			<div class="fm-items-inner">
				<a href="/">Home</a>
				<a href="#about%20me">About</a>
				<a href="/projects/">Projects</a>
				<a href="#colophon">Contact</a>
			</div>
		</div>
		<div class="fm-trigger">
			<span></span>
			<span></span>
			<span></span>
		</div>
	</div>
</div>
